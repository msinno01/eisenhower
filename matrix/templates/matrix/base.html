<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eisenhower Matrix</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'matrix/css/styles.css' %}">
</head>
<body>
<header>
    <h1>Eisenhower Matrix Task Organizer</h1>
    <nav><a href="{% url 'board' %}">Board</a> | <a href="{% url 'create_task' %}">Add Task</a></nav>
</header>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
